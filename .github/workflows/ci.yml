# Checks every pull request and every push to main. deploy/deploy.sh deploys
# only commits of main whose run of this workflow succeeded (it asks the GitHub
# API). Actions, the BuildKit daemon and tool images are pinned by commit SHA
# or digest.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      system_refresh:
        description: >-
          Key for the system-package layer (letters, digits, . _ : -). A new value
          rebuilds it with the latest Debian packages; empty keys it on Debian's archive.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # A newer push to a pull request replaces its older run. Pushes to main and
  # manual runs get a group per commit: GitHub cancels a run that is waiting
  # in a group when a newer one joins it, even without cancel-in-progress, and
  # deploy.sh refuses a commit whose run was cancelled.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # requirements.lock: torch from the PyTorch CPU index, everything else from PyPI.
  PIP_INDEX_URL: https://pypi.org/simple
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

jobs:
  lint:
    name: lint, locks and known vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - name: Install the dev tools from requirements-dev.lock
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes --no-deps -r requirements-dev.lock
      - name: requirements*.lock match requirements*.in, hashes included
        run: scripts/lock.sh --check
      - name: ruff
        run: .venv/bin/ruff check .
      - name: shell scripts
        run: |
          scripts=(deploy/deploy.sh scripts/*.sh deploy/test/run.sh deploy/test/harness/*.sh deploy/test/harness/bin/*)
          for script in "${scripts[@]}"; do bash -n "$script"; done
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt "$SHELLCHECK_IMAGE" -S warning -x deploy/deploy.sh scripts/*.sh deploy/test/run.sh
      - name: workflows
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo "$ACTIONLINT_IMAGE" -color
      - name: pip-audit
        # torch is audited as the PyPI release its CPU build is made from.
        run: |
          sed 's/+cpu//' requirements.lock > /tmp/requirements-audit.lock
          .venv/bin/pip-audit --progress-spinner off --disable-pip --require-hashes -r /tmp/requirements-audit.lock
          .venv/bin/pip-audit --progress-spinner off --disable-pip --require-hashes -r requirements-dev.lock

  test:
    name: tests (fake Whisper and Piper)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install requirements.lock and requirements-dev.lock
        run: scripts/pip_install_locked.sh "$(command -v python)" requirements.lock requirements-dev.lock
      - name: pytest
        run: python -m pytest -q -p no:cacheprovider
        env:
          PYTHONUTF8: "1"

  image:
    name: image, smoke test, tests in the image, Trivy
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Disk space for the image, its build cache and Trivy's copy (about 15 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.2
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - name: Key the system packages on Debian's archive, as deploy.sh does
        id: system
        env:
          OVERRIDE: ${{ inputs.system_refresh }}
        run: |
          key=${OVERRIDE:-$(scripts/system_refresh.sh)}
          if ! [[ $key =~ ^[A-Za-z0-9._:-]+$ ]]; then
            echo "::error::system_refresh may hold only letters, digits and . _ : -"
            exit 1
          fi
          echo "SYSTEM_REFRESH=$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: aipt:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
            SYSTEM_REFRESH=${{ steps.system.outputs.key }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image size
        run: docker image ls aipt:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'
      - name: Run it as deploy/deploy.sh does and smoke-test it
        run: |
          docker run -d --name app -p 127.0.0.1:3000:3000 --memory 9g --memory-swap 9g --pids-limit 512 \
            --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,size=256m aipt:ci
          for _ in $(seq 1 120); do
            status=$(docker inspect -f '{{.State.Health.Status}}' app)
            [ "$status" = healthy ] && break
            [ "$status" = unhealthy ] && break
            sleep 3
          done
          echo "health: $status"
          python3 deploy/smoke_test.py http://127.0.0.1:3000 || status=failed
          docker logs app 2>&1 | tail -n 40
          docker rm -f app
          [ "$status" = healthy ]
      - name: All tests inside the image, without network (real ffmpeg, Whisper and Piper)
        # The tests run on the code and files of the image's /app, so a runtime
        # file the Dockerfile does not copy fails them. From the checkout come
        # only the tests, pytest.ini and deploy/ (two tests read it).
        # test_build.py checks the repository's build files, which the image
        # does not hold; the test job runs it.
        run: |
          docker volume create aipt-dev >/dev/null
          docker run --rm -v "$PWD:/src:ro" -v aipt-dev:/tmp/dev -w /src --user 0 --entrypoint sh aipt:ci -c \
            'pip install --quiet --disable-pip-version-check --target /tmp/dev --require-hashes --no-deps -r requirements-dev.lock'
          docker run --rm --network none -v aipt-dev:/tmp/dev:ro -w /app \
            -v "$PWD/tests:/app/tests:ro" -v "$PWD/pytest.ini:/app/pytest.ini:ro" -v "$PWD/deploy:/app/deploy:ro" \
            -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONUTF8=1 -e PYTHONPATH=/tmp/dev \
            --entrypoint python aipt:ci -m pytest -q -p no:cacheprovider -m "not de" --ignore=tests/test_build.py
      - name: Trivy (fixable HIGH and CRITICAL vulnerabilities)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image --timeout 20m \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress aipt:ci
