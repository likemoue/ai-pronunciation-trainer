# Checks every pull request and every push to main. deploy/deploy.sh only deploys
# commits that are on a branch of origin, so a commit is checked here before it
# reaches production. Actions and tool images are pinned by commit SHA or digest.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # requirements.lock: torch from the PyTorch CPU index, everything else from PyPI.
  PIP_INDEX_URL: https://pypi.org/simple
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

jobs:
  lint:
    name: lint, locks and known vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - name: Install the dev tools from requirements-dev.lock
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes --no-deps -r requirements-dev.lock
      - name: requirements*.lock match requirements*.in
        run: scripts/lock.sh --check
      - name: ruff
        run: .venv/bin/ruff check .
      - name: shell scripts
        run: |
          bash -n deploy/deploy.sh scripts/lock.sh
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt "$SHELLCHECK_IMAGE" -S warning -x deploy/deploy.sh scripts/lock.sh
      - name: workflows
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo "$ACTIONLINT_IMAGE" -color
      - name: pip-audit
        # torch is audited as the PyPI release its CPU build is made from.
        run: |
          sed 's/+cpu//' requirements.lock > /tmp/requirements-audit.lock
          .venv/bin/pip-audit --progress-spinner off --disable-pip --require-hashes -r /tmp/requirements-audit.lock
          .venv/bin/pip-audit --progress-spinner off --disable-pip --require-hashes -r requirements-dev.lock

  test:
    name: tests (fake Whisper and Piper)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install requirements.lock and requirements-dev.lock
        run: pip install --require-hashes -r requirements.lock -r requirements-dev.lock
      - name: pytest
        run: python -m pytest -q -p no:cacheprovider
        env:
          PYTHONUTF8: "1"

  image:
    name: image, smoke test, tests in the image, Trivy
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: aipt:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image size
        run: docker image ls aipt:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'
      - name: Run it as deploy/deploy.sh does and smoke-test it
        run: |
          docker run -d --name app -p 127.0.0.1:3000:3000 --memory 9g --memory-swap 9g --pids-limit 512 \
            --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,size=256m aipt:ci
          for _ in $(seq 1 120); do
            status=$(docker inspect -f '{{.State.Health.Status}}' app)
            [ "$status" = healthy ] && break
            [ "$status" = unhealthy ] && break
            sleep 3
          done
          echo "health: $status"
          python3 deploy/smoke_test.py http://127.0.0.1:3000 || status=failed
          docker logs app 2>&1 | tail -n 40
          docker rm -f app
          [ "$status" = healthy ]
      - name: All tests inside the image (real ffmpeg, Whisper and Piper)
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONUTF8=1 \
            --entrypoint sh aipt:ci -c '
              pip install --quiet --disable-pip-version-check --target /tmp/dev --require-hashes --no-deps -r requirements-dev.lock &&
              PYTHONPATH=/tmp/dev python -m pytest -q -p no:cacheprovider -m "not de"'
      - name: Trivy (fixable HIGH and CRITICAL vulnerabilities)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress aipt:ci
